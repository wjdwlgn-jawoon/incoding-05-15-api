<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자운고등학교 오늘의 급식</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" type="text/css" href="https://npmcdn.com/flatpickr/dist/themes/dark.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://npmcdn.com/flatpickr/dist/l10n/ko.js"></script>
</head>
<body>
    <div class="background-elements">
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
    </div>

    <main class="container">
        <header>
            <div class="school-badge">Jaun High School</div>
            <h1>오늘의 급식 🍱</h1>
            <p class="subtitle">자운고등학교 맛있는 식단표</p>
        </header>

        <section class="controls">
            <button id="prevBtn" class="nav-btn">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
            <div class="date-display" id="calendarTrigger">
                <svg class="calendar-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="16" y1="2" x2="16" y2="6"></line>
                    <line x1="8" y1="2" x2="8" y2="6"></line>
                    <line x1="3" y1="10" x2="21" y2="10"></line>
                </svg>
                <h2 id="currentDateDisplay">로딩 중...</h2>
                <input type="text" id="datePicker" class="hidden-picker">
            </div>
            <button id="nextBtn" class="nav-btn">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
            </button>
        </section>

        <section class="meal-card" id="mealCard">
            <div class="loading-state" id="loadingState">
                <div class="spinner"></div>
                <p>식단을 불러오는 중입니다...</p>
            </div>
            
            <div class="error-state hidden" id="errorState">
                <div class="empty-icon">🍽️</div>
                <h3 id="errorMessage">오늘은 급식이 없습니다.</h3>
                <p>주말, 공휴일, 혹은 방학일 수 있습니다.</p>
            </div>

            <div class="content-state hidden" id="contentState">
                <div class="meal-type">중식</div>
                <ul class="menu-list" id="menuList">
                    <!-- 메뉴 아이템이 여기에 동적으로 추가됩니다 -->
                </ul>
                <div class="nutrition-container">
                    <button id="nutritionToggleBtn" class="calorie-badge">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0011 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 11-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 002.5 2.5z"/></svg>
                        <span id="calorieDisplay">0 Kcal</span>
                        <svg class="chevron-icon ml-1" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
                    </button>
                    <div id="nutritionDetails" class="nutrition-details hidden">
                        <!-- 영양 정보가 여기에 들어갑니다 -->
                    </div>
                </div>
                <div class="allergy-section">
                    <button id="allergyToggleBtn" class="allergy-btn">
                        <span>알레르기 유발 식품 정보</span>
                        <svg class="chevron-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
                    </button>
                    <div id="allergyInfo" class="allergy-info hidden">
                        <div class="allergy-grid">
                            <span>1. 난류</span><span>2. 우유</span><span>3. 메밀</span>
                            <span>4. 땅콩</span><span>5. 대두</span><span>6. 밀</span>
                            <span>7. 고등어</span><span>8. 게</span><span>9. 새우</span>
                            <span>10. 돼지고기</span><span>11. 복숭아</span><span>12. 토마토</span>
                            <span>13. 아황산염</span><span>14. 호두</span><span>15. 닭고기</span>
                            <span>16. 쇠고기</span><span>17. 오징어</span><span>18. 조개류*</span>
                            <span>19. 잣</span>
                        </div>
                        <p class="allergy-note">*조개류(굴, 전복, 홍합 등 포함)</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
